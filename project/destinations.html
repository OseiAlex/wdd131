<!DOCTYPE html>
<html lang="en">
<head>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Final Project for WDD 131 - Travel Explorer">
  <meta name="author" content="Alex King Osei Junior">
  <title>Travel Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/mobile.css">
  <link rel="stylesheet" media="(min-width:768px)" href="styles/desktop.css">
  <script src="scripts/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#destinations">Skip to destinations</a>
  <header class="site-header">
  <div class="brand">
    <img src="images/logo.jpeg" alt="Travel Explorer logo" class="logo" loading="lazy">
    <div class="brand-text">
      <h1>Travel Explorer</h1>
      <p class="tagline">Find your next adventure</p>
    </div>
  </div>

  <nav class="main-nav" aria-label="Main navigation">
    <ul>
      <li><a href="index.html" aria-current="page">Home</a></li>
      <li><a href="destinations.html">Destinations</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

  <main id="destinations" class="container" role="main">
    <section class="controls" aria-label="Search and filters">
      <label for="searchBox">Search destinations:</label>
      <input id="searchBox" type="search" placeholder="e.g. beach, city" aria-label="Search destinations">
      <label for="regionFilter">Region:</label>
      <select id="regionFilter" aria-label="Filter by region">
        <option value="">All</option>
        <option value="Tropical">Tropical</option>
        <option value="Highlands">Highlands</option>
        <option value="Urban">Urban</option>
        <option value="Nature">Nature</option>
      </select>
    </section>

    <section id="destinationsList" class="grid" aria-live="polite">
      <!-- JavaScript will render items here -->
    </section>
  </main>

  <footer role="contentinfo">
    <p>&copy; <span id="currentyear"></span> Travel Explorer.</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
