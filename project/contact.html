<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Final Project for WDD 131 - Travel Explorer">
  <meta name="author" content="Alex King Osei Junior">
  <title>Travel Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/mobile.css">
  <link rel="stylesheet" media="(min-width:768px)" href="styles/desktop.css">
  <script src="scripts/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contactForm">Skip to contact form</a>
  <header class="site-header" role="banner">
  <div class="brand">
    <img src="images/logo.jpeg" alt="Travel Explorer logo" class="logo" loading="lazy">
    <div class="brand-text">
      <h1>Travel Explorer</h1>
      <p class="tagline">Find your next adventure</p>
    </div>
  </div>

  <nav class="main-nav" role="navigation" aria-label="Main navigation">
    <ul>
      <li><a href="index.html" aria-current="page">Home</a></li>
      <li><a href="destinations.html">Destinations</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

  <main class="container" id="main" role="main">
    <h2>Contact Us</h2>
    <form id="contactForm" novalidate aria-describedby="formNote">
      <p id="formNote">Your messages and feedbacks are dear to us</p>

      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required minlength="2" aria-required="true">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required aria-required="true">

      <label for="subject">Subject</label>
      <input id="subject" name="subject" type="text" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <fieldset>
        <legend>Subscribe</legend>
        <label><input type="checkbox" id="subscribe" name="subscribe"> Subscribe to our newsletter</label>
      </fieldset>

      <div class="form-actions">
        <button type="submit" id="submitBtn">Submit</button>
        <button type="button" id="clearStorageBtn">Clear Saved Messages</button>
      </div>

      <div id="formStatus" role="status" aria-live="polite"></div>
    </form>
  </main>

  <footer role="contentinfo">
    <p>&copy; <span id="currentyear"></span> Travel Explorer.</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
