<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Forms">
  <meta name="author" content="Alex King Osei Junior">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="review/styles/styles.css">
  <script defer src="review/scripts/form.js"></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form action="review.html" method="get">
      <!-- Product Name -->
      <label for="product" class="required">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <!-- Overall Rating -->
      <p><fieldset>
        <legend class="required">Overall Rating</legend><br>
        <label><input type="radio" id="rating1" name="rating" value="1" required> 1 ☆</label>
        <label><input type="radio" id="rating2" name="rating" value="2"> 2 ☆</label>
        <label><input type="radio" id="rating3" name="rating" value="3"> 3 ☆</label>
        <label><input type="radio" id="rating4" name="rating" value="4"> 4 ☆</label>
        <label><input type="radio" id="rating5" name="rating" value="5"> 5 ☆</label>
      </fieldset></p>

      <!-- Date of Installation -->
      <p><label for="installDate" class="required">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required></p>

      <!-- Useful Features -->
      <p><fieldset>
        <legend>Useful Features (check all that apply)</legend>
        <label><input type="checkbox" id="feature1" name="features" value="easy_install"> Easy Install</label>
        <label><input type="checkbox" id="feature2" name="features" value="durable"> Durable</label>
        <label><input type="checkbox" id="feature3" name="features" value="energy_saver"> Energy Saver</label>
        <label><input type="checkbox" id="feature4" name="features" value="good_support"> Good Support</label>
      </fieldset></p><br>

      <!-- Written Review -->
      <br><p><label for="reviewText">Written Review</label>
      <textarea id="reviewText" name="reviewText" rows="4"></textarea></p>

      <!-- User Name -->
      <p><label for="userName">Your Name</label>
      <input type="text" id="userName" name="userName"></p>

      <!-- Submit -->
      <p><input type="submit" value="Submit Review" class="btn"></p>
    </form>
  </main>

  <footer>
    <p>&copy; <span id="copyright-year"></span> <span class="owner">Alex King Osei Junior</span>.</p>
    <p>Contact: <a href="mailto:oalexking@yahoo.com">oalexking@yahoo.com</a></p>
    <p>Last Modified: <span id="last-modified"></span></p>
  </footer>
</body>
</html>
