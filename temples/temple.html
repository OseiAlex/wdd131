<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 768px)">
    <script defer src="scripts/temples.js"></script>
</head>
<body>
    <header>
        <h1>Temple Album</h1>
        <nav>
            <button id="hamburger">&#9776;</button> <!-- Hamburger button -->
            <ul id="menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main section with images of temples -->
    <main>
        <h2>Home</h2>
        <section class="grid-container">
            <figure>
                <img src="images/accra-ghana-temple.jpg" alt="Accra Ghana Temple">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>
            <figure>
                <img src="images/albuquerque-temple.jpg" alt="Albuquerque Temple">
                <figcaption>Albuquerque Temple</figcaption>
            </figure>
            <figure>
                <img src="images/anchorage-temple.jpg" alt="Anchorage Temple">
                <figcaption>Anchorage Temple</figcaption>
            </figure>
            <figure>
                <img src="images/apia-samoa.jpg" alt="Apia Temple">
                <figcaption>Apia Temple</figcaption>
            </figure>
            <figure>
                <img src="images/Barranquilla-Columblia-Temple.jpg" alt="Barranquilla ColumbliaTemple">
                <figcaption>Barranquilla Temple</figcaption>
            </figure>
            <figure>
                <img src="images/belem_brazil_temple_exterior.jpg" alt="Belem Brazil Temple">
                <figcaption>Belem Brazil Temple</figcaption>
            </figure>
            <figure>
                <img src="images/ber-switzerland-temple-lds.jpg" alt="Ber Temple">
                <figcaption>Bern Switzerland Temple</figcaption>
            </figure>
            <figure>
                <img src="images/Billings-Montana-Temple.jpg" alt="Billings-Montana-Temple Temple">
                <figcaption>Billings Montana Temple</figcaption>
            </figure>
            <figure>
                <img src="images/birmingham-temple.jpg" alt="Birmingham Temple">
                <figcaption>Birmingham Temple</figcaption>
            </figure>
            <!-- Repeat for other temple images -->
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Your Name. All rights reserved. | Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
